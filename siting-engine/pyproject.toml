[project]
name = "solsat-siting"
version = "0.3.0"
description = "Site suitability API for SOLSAT: SAR flood history, DEM and land cover, with evidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic-settings>=2.4",
  "numpy>=2.0",
  "scipy>=1.13",
  "pillow>=10.4",
  "pyproj>=3.6",
]

[project.optional-dependencies]
# Data pipeline (needs network). Not needed to run the API.
pipeline = [
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "odc-stac>=0.3.10",
  "rasterio>=1.4",
  "affine>=2.4",
  "dask>=2024.8",
]

[project.scripts]
siting-run = "siting.pipeline.run:main"
siting-ingest = "siting.pipeline.ingest:main"
siting-ingest-pairs = "siting.pipeline.ingest:main_pairs"
siting-optical = "siting.pipeline.optical:main"
siting-build = "siting.pipeline.build:main"
siting-calibrate = "siting.calibrate:main"
siting-openapi = "siting.api.openapi:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "ty>=0.0.104",
]
experiments = ["pysheds>=0.4"]   # flow-routing HAND, see experiments/

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "siting"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]  # starlette now suggests the httpx2 package; not adopted until verified

[tool.coverage.report]
fail_under = 85
skip_covered = true
show_missing = true

[tool.coverage.run]
source = ["siting"]
omit = ["src/siting/pipeline/ingest.py", "src/siting/pipeline/optical.py", "src/siting/pipeline/irradiance.py"]  # need network

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["prototype"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PT", "NPY"]
ignore = ["E501", "E741", "B008", "PT018", "RUF001", "RUF002", "RUF003"]  # B008: FastAPI Query/Body defaults; PT018: compound asserts are fine; RUF00x: Thai text

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"experiments/*" = ["E402", "NPY201", "SIM115", "UP031", "E501"]

[tool.ty.src]
include = ["src", "tests"]
